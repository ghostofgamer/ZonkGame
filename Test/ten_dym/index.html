<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Дымная тень</title>
<style>
@font-face{font-family:R;src:url(../../Assets/ZonkContent/Art/Fonts/Rubik-Bold.ttf)}
body{margin:0;background:#15100c;color:#f3e3bf;font:15px R,Arial}
.bar{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 12px;align-items:center}
.bar span{color:#c3ae8e}.g{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
button{font:14px R,Arial;background:#33261b;color:#f3e3bf;border:2px solid #5b4632;border-radius:6px;padding:5px 10px;cursor:pointer}
button[aria-pressed=true]{background:#ffc62e;color:#15100c;border-color:#15100c}
#stage{position:relative;width:min(100vw,calc((100vh - 48px)*16/9));aspect-ratio:16/9;margin:auto;overflow:hidden}
#stage canvas,#stage img{position:absolute;left:0;top:0;width:100%;height:100%}
#stage img.acc{height:auto;transform-origin:50% 50%}
</style></head><body>
<div class="bar">
 <div class="g" id="mode"><span>Дым:</span><button data-v="soft">Мягкий</button><button data-v="comic">Комикс</button></div>
 <div class="g" id="hat"><span>На голове:</span><button data-v="">Нет</button><button data-v="cap">Кепка</button><button data-v="tricorn">Треуголка</button><button data-v="crown">Корона</button><button data-v="horns">Рога</button></div>
 <div class="g" id="chain"><span>Цепь:</span><button data-v="0">Нет</button><button data-v="1">Есть</button></div>
 <div class="g" id="eye"><span>Глаза:</span><button data-v="gold">Жёлтые</button><button data-v="red">Красные</button><button data-v="cyan">Бирюзовые</button></div>
</div>
<div id="stage"><canvas id="bg" width="1440" height="810"></canvas><canvas id="gl" width="1440" height="810"></canvas><img id="acc" class="acc" alt=""><canvas id="fg" width="1440" height="810"></canvas></div>
<script id="fs" type="x">
precision highp float;
uniform float t; uniform float comic; uniform vec3 eye; uniform vec2 res;
float hash(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+34.3);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,v=0.;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+vec2(11.,7.);a*=.5;}return v;}
float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float figure(vec2 p){
  float d=length((p-vec2(0.,.02))*vec2(1.,.92))-.52;                         // голова
  d=smin(d,seg(p,vec2(0.,-.3),vec2(0.,-.9))-.26,.28);                        // шея
  d=smin(d,seg(p,vec2(-1.02,-1.02),vec2(1.02,-1.02))-.42,.5);                // плечи, сутулые
  d=smin(d,seg(p,vec2(0.,-1.1),vec2(0.,-3.))-1.05,.5);                       // торс
  d=smin(d,seg(p,vec2(-1.15,-1.05),vec2(-2.55,-.5))-.22,.3);                 // руки до рукавов
  d=smin(d,seg(p,vec2(1.15,-1.05),vec2(1.45,-.6))-.24,.3);
  return d;
}
void main(){
  vec2 px=vec2(gl_FragCoord.x,res.y-gl_FragCoord.y)/res*vec2(1440.,810.);
  vec2 p=(px-vec2(720.,132.))/100.; p.y=-p.y;
  if(px.y>249.){gl_FragColor=vec4(0.);return;}
  // Дым ползёт вверх: шум бежит по времени, чем дальше от ядра, тем сильнее изгиб.
  vec2 up=vec2(0.,-t*.32);
  float loose=mix(.28,1.,smoothstep(-.35,-1.25,p.y));
  vec2 q=p+vec2(fbm(p*1.1+up)-.5,fbm(p*1.1+up+vec2(5.2,1.3))-.5)*.75*loose;
  float d=figure(q);
  float fine=fbm(p*2.6+up*1.7+vec2(fbm(p*1.4+up),0.));
  float e=d+(fine-.5)*.85*loose;
  // Ядро и дым по краю.
  float core=smoothstep(.16,-.22,e);
  float haze=smoothstep(.7,-.05,e)*smoothstep(.22,.6,fine+.1);
  // Тонкие струйки: хребты шума, только рядом с фигурой и выше неё.
  float ridge=1.-abs(fbm(vec2(p.x*1.7,p.y*.7)+up*1.5)*2.-1.);
  float wisps=pow(ridge,14.)*smoothstep(.85,.1,d)*.6;
  float a=max(core,max(haze*.72,wisps));
  if(comic>.5){
    // Те же формы ступенями и растром точек, как тени на столе.
    float s=.11;vec2 g=mod(px*mat2(.866,.5,-.5,.866),vec2(9.))-4.5;
    float dot1=step(length(g),3.3);
    a=a>.72?1.:a>.42?.78+.0*dot1:a>.16?dot1*.8:0.;
  }
  vec3 smoke=mix(vec3(.13,.1,.17),vec3(.018,.014,.026),smoothstep(.1,.8,a));
  vec3 col=smoke;
  // Глаза: маленькие, с ореолом; иногда моргают.
  float blink=smoothstep(.0,.05,abs(mod(t,4.3)-.1)-.06);
  vec2 ep=vec2(abs(p.x)-.21,(p.y-.04)/(.08+.92*blink));
  ep.x+=ep.y*.25;
  float r=length(ep*vec2(1.,1.9));
  float eyeCore=smoothstep(.085,.05,r);
  float glow=exp(-r*r*34.)*.75*blink;
  col=mix(col,eye,clamp(glow,0.,1.)); col=mix(col,vec3(1.,.97,.85),eyeCore);
  a=max(a,max(eyeCore,glow));
  gl_FragColor=vec4(col*a,a);
}
</script>
<script>
const $=id=>document.getElementById(id);
const state={mode:'soft',hat:'',chain:'0',eye:'gold'};
(location.hash.slice(1).split('&')).forEach(s=>{const[k,v]=s.split('=');if(k in state)state[k]=v||''});
const EYES={gold:[1,.74,.15],red:[1,.2,.1],cyan:[.2,.95,.9]};
function sync(){for(const k of['mode','hat','chain','eye']){$(k).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state[k]))}
 const a=$('acc');if(state.hat){a.src='acc_'+state.hat+'.png';a.style.display='block'}else a.style.display='none'; drawFg();}
['mode','hat','chain','eye'].forEach(k=>$(k).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state[k]=b.dataset.v;sync()}));
// Аксессуар: рендер 768, голова в нём в точке (384,313) радиусом 63; на сцене голова (720,117) радиусом 55.
const acc=$('acc');const S=55/63*768/1440;acc.style.width=(S*100)+'%';acc.style.left=((720-384*55/63)/1440*100)+'%';acc.style.top=((132-313*55/63)/810*100)+'%';
let base=null,baseImg=null;
function drawFg(){ if(!base)return;const c=$('fg').getContext('2d');const out=c.createImageData(1440,810),d=out.data,b=base.data;
 for(let y=0;y<810;y++)for(let x=0;x<1440;x++){const X=x+240,Y=y+183,i=(y*1440+x)*4;const left=X>620&&X<770&&Y>285&&Y<445,right=X>985&&X<1165&&Y>306&&Y<445,cup=X>618&&X<738&&Y>355&&Y<500;
  if(cup||((left||right)&&Math.min(b[i],b[i+1],b[i+2])>128)){d[i]=b[i];d[i+1]=b[i+1];d[i+2]=b[i+2];d[i+3]=255}}
 c.putImageData(out,0,0);
 if(state.chain==='1'){c.lineWidth=5;c.strokeStyle='#15100c';c.fillStyle='#ffc62e';for(let i=0;i<=14;i++){const a=i/14*Math.PI,x=720+Math.cos(a)*62,y=193+Math.sin(a)*40;c.beginPath();c.ellipse(x,y,9,6,a+1.2,0,7);c.stroke();c.fill()}c.beginPath();c.arc(720,241,15,0,7);c.stroke();c.fill()}
}
const im=new Image();im.onload=()=>{const c=$('bg').getContext('2d',{willReadFrequently:true});c.translate(-240,-183);c.drawImage(im,0,0);c.setTransform(1,0,0,1,0,0);base=c.getImageData(0,0,1440,810);
 const px=(x,y)=>{const i=(y*1440+x)*4,d=base.data;return `rgb(${d[i]},${d[i+1]},${d[i+2]})`};c.fillStyle=px(530,60);c.fillRect(550,0,345,130);c.fillStyle=px(530,190);c.fillRect(550,130,345,122);drawFg()};im.src='frame.jpg';
const gl=$('gl').getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});
const sh=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,$('fs').textContent));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.bindAttribLocation(pr,0,'a');gl.linkProgram(pr);gl.useProgram(pr);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
function frame(ms){gl.uniform1f(U('t'),ms/1000+3.);gl.uniform1f(U('comic'),state.mode==='comic'?1:0);gl.uniform3fv(U('eye'),EYES[state.eye]);gl.uniform2f(U('res'),1440,810);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);
 const bob=Math.sin(ms/900)*.3;acc.style.transform='translateY('+bob+'%)';requestAnimationFrame(frame)}
sync();requestAnimationFrame(frame);
</script></body></html>
